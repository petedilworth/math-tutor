name: Daily email

# Sends the morning lesson to everyone who opted in, after the live data job has run.
# Needs these repository secrets: SUPABASE_URL, SUPABASE_SERVICE_KEY, GMAIL_USER, GMAIL_APP_PASSWORD.
# And one repository variable: SITE_URL (e.g. https://petedilworth.github.io/math-tutor).
# Scheduled workflows only run on the default branch.

on:
  schedule:
    - cron: "0 11 * * *"   # 11:00 UTC, 7:00 am Toronto in summer, 6:00 in winter
  workflow_dispatch:

jobs:
  send:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - run: npm install --no-save nodemailer@6
      - run: node tools/send-daily.js
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
          GMAIL_USER: ${{ secrets.GMAIL_USER }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
          SITE_URL: ${{ vars.SITE_URL }}
